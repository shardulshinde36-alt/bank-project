apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshopdjango
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eshopdjango
  template:
    metadata:
      labels:
        app: eshopdjango
    spec:
      containers:
        - name: eshopdjango
          image: shardul12304/eshopdjango:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: eshopdjango-service
spec:
  type: NodePort
  selector:
    app: eshopdjango
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
